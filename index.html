<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学内ボランティア掲示板</title>
<meta name="description" content="授業の合間や週末にできるボランティア活動の募集を、まとめて探せる掲示板です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2430; --muted:#5b6675; --line:#d5dbe3;
  --board:#1f3a4d; --board-ink:#f4f7fa; --note:#ffd75e; --note-ink:#3b2f00; --accent:#1f6f8b; --accent-ink:#ffffff;
  --c1:#2d7a4b; --c2:#d9822b; --c3:#b4477a; --c4:#c2412d; --c5:#3b6fb6; --c6:#7a5bb5;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f161d; --surface:#18222c; --ink:#e8edf2; --muted:#9aa7b5; --line:#2a3745;
    --board:#122431; --note:#e8be3f; --note-ink:#2b2200; --accent:#5fb3d1; --accent-ink:#0c1a22;
    --c1:#6cc08b; --c2:#eba15a; --c3:#e083ae; --c4:#ec8473; --c5:#7fa8e0; --c6:#a891dd;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

header.top{background:var(--board);color:var(--board-ink);padding:calc(44px + env(safe-area-inset-top,0px)) 0 36px}
.eyebrow{display:inline-block;margin:0 0 12px;background:var(--note);color:var(--note-ink);font-weight:700;font-size:14px;padding:1px 14px;border-radius:999px}
header.top h1{margin:0 0 10px;font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:.02em;line-height:1.25}
header.top p{margin:0;max-width:34em;color:color-mix(in srgb,var(--board-ink) 82%,transparent)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.stat{background:color-mix(in srgb,var(--board-ink) 10%,transparent);border-radius:10px;padding:8px 16px;font-size:14px}
.stat b{font-size:22px;margin-right:4px}
.stat.upd{background:var(--note);color:var(--note-ink);font-size:16px;font-weight:700}
.stat.upd b{font-size:30px;margin:0 2px}

.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tools-row{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px;font-size:14px;text-decoration:none;color:var(--ink);cursor:pointer}
a.chip:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding:12px 0 56px}
section{padding-top:32px}
h2{margin:0 0 4px;font-size:24px;font-weight:900}
.lead{margin:0 0 16px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:16px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px 22px}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--cat,var(--accent))}
.tag{font-size:13px;font-weight:700;color:var(--cat,var(--accent))}
.card h3{margin:0;font-size:18px;line-height:1.45}
.org{margin:0;font-size:13px;color:var(--muted)}
.meta{margin:4px 0 0;padding:0;list-style:none;font-size:14px}
.meta span{color:var(--muted);display:inline-block;min-width:3.2em}
.desc{margin:4px 0 0;font-size:14px;color:var(--muted)}
details{margin-top:4px;font-size:14px}
summary{cursor:pointer;color:var(--accent);font-weight:700}
details p{margin:6px 0 0;white-space:pre-wrap}
.flyer{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0 2px;cursor:zoom-in}
.pdf{display:block;width:100%;height:70vh;min-height:420px;border:1px solid var(--line);border-radius:8px;margin:10px 0 2px;background:#fff}
.pdflinks{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.pdflinks a{color:var(--accent);font-weight:700}
#zoom{border:0;border-radius:12px;padding:10px;max-width:min(96vw,760px);background:var(--surface)}
#zoom::backdrop{background:rgba(0,0,0,.7)}
#zoom img{display:block;max-width:100%;max-height:82vh;margin:0 auto;border-radius:6px}
#zoom button{display:block;margin:10px auto 0;padding:8px 24px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.foot{margin-top:auto;padding-top:12px}
.btn{display:inline-block;border:0;border-radius:8px;padding:8px 18px;font-weight:700;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.soon{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0;grid-column:1/-1}

.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--board);color:var(--board-ink);font-weight:900;margin-bottom:8px}
.step h3{margin:0 0 2px;font-size:17px}
.step p{margin:0;font-size:14px;color:var(--muted)}

.carousel{overflow:hidden;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.track{display:flex;transition:transform .6s ease}
.slide{min-width:100%;aspect-ratio:16/9}
.slide img{display:block;width:100%;height:100%;object-fit:cover}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:14px}
.controls button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.dots{color:var(--muted);font-size:14px;min-width:3.5em;text-align:center}
.contact p{margin:2px 0;font-size:15px}
.contact a:not(.btn){color:var(--accent);font-weight:700}
footer{padding:0 0 40px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.track{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="eyebrow" id="eyebrow"></span>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <div class="stats" id="stats"></div>
</div></header>

<div class="tools"><div class="wrap tools-row">
  <nav class="chips" id="nav" aria-label="ページ内メニュー"></nav>
</div></div>

<main><div class="wrap">
  <section id="posts"><h2>募集中のボランティア</h2>
    <p class="lead">気になる募集は「詳細」を開いて、Googleフォームから応募できます。募集したい団体の方は、「募集する方へ」をご覧ください。</p>
    <div class="chips" id="filters" role="group" aria-label="カテゴリで絞り込む"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="info"><h2>地域のイベント・お知らせ</h2>
    <p class="lead">ボランティアの募集ではない、学生に知ってほしい地域のイベントや情報です。</p>
    <div class="grid" id="infoGrid"></div>
  </section>
  <section id="flow"><h2>参加の流れ</h2><p class="lead">はじめての人も、この順番で参加できます。</p><div class="steps" id="steps"></div></section>
  <section id="contact"><h2>お問い合わせ</h2>
    <div class="card contact" style="--cat:var(--c5)"><span class="tag" id="igName"></span>
      <p>お問い合わせは、学生委員会のInstagramのDMまでお願いします。</p>
      <p class="soon">下のボタンを押すと、学生委員会のInstagramのページが開きます。ページの「メッセージ」から、DMを送ってください。</p>
      <div class="foot"><a class="btn" id="igBtn" target="_blank" rel="noopener noreferrer">Instagramを開く</a></div>
    </div>
  </section>
  <section id="gallery" hidden><h2>活動の様子</h2>
    <div class="carousel" aria-roledescription="carousel" aria-label="活動の写真"><div class="track" id="track"></div></div>
    <div class="controls">
      <button id="prev" type="button" aria-label="前へ">&#8249;</button><span class="dots" id="dots"></span>
      <button id="pause" type="button" aria-label="一時停止">&#10074;&#10074;</button><button id="next" type="button" aria-label="次へ">&#8250;</button>
    </div>
  </section>
</div></main>
<footer><div class="wrap" id="copy"></div></footer>
<dialog id="zoom" aria-label="チラシの拡大表示"><img id="zoomImg" alt=""><button type="button" id="zoomClose">閉じる</button></dialog>

<script>
/* ===== 内容(ここだけ書き換えれば、ページが更新されます) ===== */
const SITE = {
  eyebrow: "学生ボランティア",
  title: "学内ボランティア掲示板",
  lead: "授業の合間や週末にできる活動を探せます。募集は、団体からの依頼を、管理者が確認してから載せています。",
  copy: "© 下関市立大学 学生委員会",
  updateDay: "月",   // 毎週何曜日に更新するか(例: "月")。表示しないときは "" にします。
  instagram: "https://www.instagram.com/scu_coop_gakui/",
  instagramName: "@scu_coop_gakui"
};
const CATS = [
  ["地域・環境", "var(--c1)"], ["子ども・教育", "var(--c2)"], ["福祉・介護", "var(--c3)"],
  ["防災・災害支援", "var(--c4)"], ["国際交流", "var(--c5)"], ["イベント運営", "var(--c6)"]
];
// 新しい募集ほど上に。until は掲載を終える日(その日の終わりに自動で非表示)。ずっと載せるなら ""。
// formUrl は応募用のGoogleフォームのURL。まだなければ ""。
// flyer はチラシ。同じフォルダーの flyers フォルダーに画像を入れて "flyers/名前.jpg" と書く。なければ省略してOK。
const POSTS = [
  { title: "学園祭の当日スタッフ", org: "学園祭実行委員会", cat: "イベント運営", seats: "30", date: "12/12(土)・13(日)", place: "キャンパス全体",
    desc: "1日だけの参加もできます。", detail: "会場案内、模擬店の補助、ごみ回収などをお願いします。\n集合時間と持ち物は、応募のあとに連絡します。", formUrl: "", until: "2026-12-13" },
  { title: "防災訓練の運営スタッフ", org: "学生防災会", cat: "防災・災害支援", seats: "20", date: "12/5(土) 10:00〜15:00", place: "体育館",
    desc: "避難所開設の体験訓練です。", detail: "受付と案内を担当します。動きやすい服装で来てください。", formUrl: "", until: "2026-12-05" },
  { title: "高齢者施設でのレクリエーション補助", org: "福祉ボランティア部", cat: "福祉・介護", seats: "8", date: "11/28(土) 13:00〜15:00", place: "特別養護老人ホーム",
    desc: "歌や体操のサポートです。", detail: "事前に30分の説明会があります。", formUrl: "", until: "2026-11-28" },
  { title: "キャンパス周辺の清掃活動", org: "環境サークル グリーンリーフ", cat: "地域・環境", seats: "15", date: "12/15(日) 9:00〜11:00", place: "正門前集合",
    desc: "軍手とトングは貸し出します。", detail: "ごみ拾いと分別を行います。雨天中止です。", flyer: "flyers/cleanup-sample.jpg", formUrl: "", until: "2026-12-15" },
  { title: "小学生の学習支援(放課後教室)", org: "教育学部 学習支援ネット", cat: "子ども・教育", seats: "6", date: "毎週水曜 16:00〜17:30", place: "地域の公民館",
    desc: "宿題を一緒に見る活動です。", detail: "継続して参加できる方を歓迎します。", formUrl: "", until: "" },
  { title: "留学生と話す日本語カフェ", org: "国際交流センター", cat: "国際交流", seats: "10", date: "毎週金曜 12:20〜13:00", place: "学生ラウンジ",
    desc: "語学の資格は不要です。", detail: "留学生と昼休みに、日本語で雑談します。", formUrl: "", until: "" },
  { title: "森保ラストマッチ", org: "下関市立大学学生委員会", cat: "地域・環境", seats: "10", date: "12月41日", place: "大学の食堂",
   desc: "ああああ", detail: "愛", formUrl: "https://docs.google.com/forms/d/e/1FAIpQLSeZwX9aQBp15vkx0_itl0WNO90RWkdWqydH2HJ4bZmUPmio0w/viewform?usp=publish-editor", until: "2027-01-01" },
  { title: "わんぱく子ども相撲大会　当日スタッフ ", org: "下関相撲協議会", cat: "子ども・教育", seats: "10", date: "1月1日　11時～", place: "安徳帝御入水之処碑",
    desc: "大学生のボランティア募集中！！", detail: "汚れてもよい服装でお越しください！", formUrl: "", until: "" },
  
];
const STEPS = [
  ["募集を探す", "カテゴリやキーワードで、自分に合う活動を見つけます。"],
  ["詳細を読む", "日時、場所、持ち物を確認します。"],
  ["フォームで応募", "募集ごとのGoogleフォームに入力して送信します。"],
  ["団体から連絡", "集合時間などの案内が届きます。当日、活動に参加します。"]
];
// ===== 地域のイベント・お知らせ(ボランティアの募集ではないもの) =====
// title: 名前 / org: 主催 / date: 日時 / place: 場所 / desc: ひとこと / detail: 詳細(省略できます)
// flyer: チラシ画像(flyers/名前.jpg、省略できます) / pdf: PDF(pdfs/名前.pdf、省略できます) / url: くわしいページのURL(https://…、省略できます)
// until: 掲載を終える日(例 "2026-12-31")。ずっと載せるなら ""。
// ↓ いまはサンプルです。実際の内容に書き換えてください。
const INFO = [
  { title: "北部公民館の夏祭り", org: "北部公民館", date: "日程は決まりしだい掲載します", place: "北部公民館",
    desc: "地域のみなさんと楽しむ夏祭りです。", detail: "", flyer: "flyers/kita-natsumatsuri.svg", url: "", until: "" },
  { title: "地域の神社のお祭り", org: "地域の神社", date: "日程は決まりしだい掲載します", place: "地域の神社",
    desc: "地域に伝わるお祭りです。", detail: "", flyer: "flyers/cleanup-sample.jpg", url: "", until: "" }
];
// 活動の写真。空 [] のままなら、「活動の様子」は表示されません。
// 写真を使うときは、同じフォルダーの photos フォルダーに入れて ["photos/名前.jpg", "写真の説明"] と書きます。
const PHOTOS = [];
/* ============================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const catColor = n => (CATS.find(c => c[0] === n) || CATS[0])[1];
const https = u => { try { return new URL(u).protocol === "https:"; } catch (e) { return false; } };
function flyerOf(u) {
  if (!u) return null;
  if (/^flyers\/[\w\-.]+\.(png|jpe?g|gif|webp|svg)$/i.test(u)) return { img: u, link: u };
  if (!https(u)) return null;
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/.*[?&]id=([\w-]+)/);
  if (m) return { img: "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1200", link: u };
  if (/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u)) return { img: u, link: u };
  return { img: "", link: u };
}
function pdfOf(u) {
  if (!u) return null;
  if (/^pdfs\/[\w\-.]+\.pdf$/i.test(u)) return { src: u + "#view=FitH", link: u };
  if (!https(u)) return null;
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (m) return { src: "https://drive.google.com/file/d/" + m[1] + "/preview", link: u };
  return { src: u, link: u };
}
function detailHtml(p) {
  const f = flyerOf(p.flyer), d = pdfOf(p.pdf);
  if (!f && !d && !p.detail) return "";
  const text = p.detail ? `<p>${esc(p.detail)}</p>` : "";
  const fly = f ? (f.img
    ? `<img class="flyer" src="${esc(f.img)}" alt="${esc(p.title)}の募集チラシ" loading="lazy" referrerpolicy="no-referrer" tabindex="0" role="button" title="押すと大きく表示します">`
    : `<p><a href="${esc(f.link)}" target="_blank" rel="noopener noreferrer">チラシを開く</a></p>`) : "";
  const pdf = d ? `<div class="pdfbox" data-src="${esc(d.src)}" data-title="${esc(p.title)}のPDF"><div class="pdflinks"><a href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">PDFを別のタブで開く</a></div></div>` : "";
  const label = ["詳細", f ? "チラシ" : "", d ? "PDF" : ""].filter(Boolean).join("・");
  return `<details><summary>${label}</summary>${text}${fly}${pdf}</details>`;
}
const okForm = u => { try { const x = new URL(u); return x.protocol === "https:" && ((x.hostname === "docs.google.com" && x.pathname.startsWith("/forms")) || x.hostname === "forms.gle"); } catch (e) { return false; } };
const now = new Date();
const posts = POSTS.filter(p => !p.until || new Date(p.until + "T23:59:59") >= now);
const info = INFO.filter(p => !p.until || new Date(p.until + "T23:59:59") >= now);
let cat = "すべて";

$("#eyebrow").textContent = SITE.eyebrow;
$("#title").textContent = SITE.title;
$("#lead").textContent = SITE.lead;
$("#copy").textContent = SITE.copy;
if (/^https:\/\/(www\.)?instagram\.com\//.test(SITE.instagram)) { $("#igBtn").href = SITE.instagram; $("#igName").textContent = "学生委員会 " + SITE.instagramName; } else { $("#contact").hidden = true; }
$("#stats").innerHTML = `<div class="stat"><b>${posts.length}</b>件の募集</div><div class="stat"><b>${new Set(posts.map(p => p.org)).size}</b>団体</div>${SITE.updateDay ? `<div class="stat upd">毎週<b>${esc(SITE.updateDay)}</b>曜日更新</div>` : ""}`;
$("#nav").innerHTML = [["#posts", "募集一覧"], info.length ? ["#info", "地域のイベント"] : null, ["#flow", "参加の流れ"], PHOTOS.length ? ["#gallery", "活動の様子"] : null, ["#contact", "お問い合わせ"], ["recruit.html", "募集する方へ"]]
  .filter(Boolean).map(n => `<a class="chip" href="${n[0]}">${n[1]}</a>`).join("");
$("#steps").innerHTML = STEPS.map(s => `<div class="step"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");

function renderFilters() {
  $("#filters").innerHTML = ["すべて", ...CATS.map(c => c[0])].map(n => `<button class="chip" type="button" aria-pressed="${n === cat}" data-c="${esc(n)}">${esc(n)}</button>`).join("");
}
function renderPosts() {
  const items = posts.filter(p => cat === "すべて" || p.cat === cat);
  $("#grid").innerHTML = items.length ? items.map(p => `<article class="card" style="--cat:${catColor(p.cat)}">
    <div class="tag">${esc(p.cat)}</div><h3>${esc(p.title)}</h3><p class="org">${esc(p.org)}</p>
    <ul class="meta"><li><span>日時</span>${esc(p.date)}</li><li><span>場所</span>${esc(p.place)}</li>${p.seats ? `<li><span>人数</span>${esc(p.seats)}名</li>` : ""}</ul>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
    ${detailHtml(p)}
    <div class="foot">${okForm(p.formUrl) ? `<a class="btn" href="${esc(p.formUrl)}" target="_blank" rel="noopener noreferrer">Googleフォームで応募する</a>` : `<span class="soon">応募フォームは準備中です</span>`}</div>
  </article>`).join("") : `<p class="empty">この分野の募集は、いまありません。</p>`;
}
$("#filters").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; renderFilters(); renderPosts(); });
renderFilters(); renderPosts();


if (info.length) {
  $("#infoGrid").innerHTML = info.map(p => `<article class="card" style="--cat:var(--c6)">
    <div class="tag">地域のイベント</div><h3>${esc(p.title)}</h3>${p.org ? `<p class="org">主催: ${esc(p.org)}</p>` : ""}
    <ul class="meta"><li><span>日時</span>${esc(p.date)}</li><li><span>場所</span>${esc(p.place)}</li></ul>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
    ${detailHtml(p)}
    ${https(p.url) ? `<div class="foot"><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">くわしくはこちら</a></div>` : ""}
  </article>`).join("");
} else { $("#info").hidden = true; }

document.addEventListener("toggle", e => {
  const d = e.target; if (!d.open || !d.matches("details")) return;
  d.querySelectorAll(".pdfbox[data-src]").forEach(b => {
    if (b.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.className = "pdf"; f.src = b.dataset.src; f.title = b.dataset.title; f.setAttribute("referrerpolicy", "no-referrer");
    b.prepend(f);
  });
}, true);
const zoom = $("#zoom");
document.addEventListener("click", e => { const im = e.target.closest("img.flyer"); if (!im) return; $("#zoomImg").src = im.src; $("#zoomImg").alt = im.alt; zoom.showModal(); });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("img.flyer")) { e.preventDefault(); e.target.click(); } });
$("#zoomClose").onclick = () => zoom.close();
zoom.addEventListener("click", e => { if (e.target === zoom) zoom.close(); });

if (PHOTOS.length) {
  $("#gallery").hidden = false;
  $("#track").innerHTML = PHOTOS.map(p => `<div class="slide"><img src="${esc(p[0])}" alt="${esc(p[1])}" loading="lazy"></div>`).join("");
  const track = $("#track"), total = PHOTOS.length;
  let i = 0, playing = !matchMedia("(prefers-reduced-motion: reduce)").matches, timer;
  const go = n => { i = (n + total) % total; track.style.transform = "translateX(" + (-100 * i) + "%)"; $("#dots").textContent = (i + 1) + " / " + total; };
  const start = () => { clearInterval(timer); timer = setInterval(() => go(i + 1), 4000); };
  const setPause = () => { const b = $("#pause"); b.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;"; b.setAttribute("aria-label", playing ? "一時停止" : "再生"); };
  $("#prev").onclick = () => go(i - 1);
  $("#next").onclick = () => go(i + 1);
  $("#pause").onclick = () => { playing = !playing; setPause(); playing ? start() : clearInterval(timer); };
  go(0); setPause(); if (playing) start();
}
</script>
</body>
</html>
